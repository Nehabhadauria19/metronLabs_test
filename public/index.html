<!DOCTYPE html>
<html>
<head>
  <title>GitLab Risk Scanner</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    input, button {
      padding: 10px;
      margin: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
    }

    th {
      background: #333;
      color: white;
    }

    .high { color: red; font-weight: bold; }
    .low { color: green; font-weight: bold; }
  </style>
</head>

<body>

<h1>GitLab Risk Scanner</h1>

<input id="username" placeholder="Enter GitLab username" />
<button onclick="scan()">Scan</button>

<table>
  <thead>
    <tr>
      <th>Project</th>
      <th>Issue</th>
      <th>Severity</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
async function scan() {
  const username = document.getElementById("username").value;

  const res = await fetch(`/api/scan?username=${username}`);
  const data = await res.json();

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  if (!data.results || data.results.length === 0) {
    tbody.innerHTML = "<tr><td colspan='3'>No data found</td></tr>";
    return;
  }

  data.results.forEach(project => {
    if (project.issues.length === 0) {
      tbody.innerHTML += `
        <tr>
          <td>${project.project}</td>
          <td>No Issues</td>
          <td class="low">Safe</td>
        </tr>`;
    } else {
      project.issues.forEach(issue => {
        const cls = issue.severity.toLowerCase();
        tbody.innerHTML += `
          <tr>
            <td>${project.project}</td>
            <td>${issue.message}</td>
            <td class="${cls}">${issue.severity}</td>
          </tr>`;
      });
    }
  });
}
</script>

</body>
</html>
